<div class="min-h-screen bg-slate-50 p-6 md:p-12">
  <div class="max-w-6xl mx-auto">
    
    <!-- Header Area -->
    <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight text-left">Saved Opportunities</h1>
        <p class="text-slate-500 mt-1">Manage the jobs you've bookmarked for later.</p>
      </div>
      <!-- Added () to favorites -->
      <div *ngIf="favorites().length > 0" class="bg-white px-4 py-2 rounded-full border border-slate-200 text-sm font-medium text-slate-600 shadow-sm w-fit">
        {{ favorites().length }} Jobs Saved
      </div>
    </header>

    <!-- Content Grid -->
    <!-- Added () to favorites -->
    <div *ngIf="favorites().length > 0; else noFavs" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let job of favorites()" 
           class="group relative bg-white border border-slate-200 rounded-xl p-6 transition-all duration-300 hover:shadow-xl hover:shadow-slate-200/50 hover:-translate-y-1">
        
        <!-- Action: Remove Button -->
        <button (click)="removeFavorite(job.id)" 
                class="absolute top-4 right-4 p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                title="Remove from favorites">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>

        <!-- Job Info -->
        <div class="mb-4 text-left">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold bg-indigo-50 text-indigo-700 mb-3">
            {{ job.company }}
          </span>
          <h3 class="text-lg font-bold text-slate-900 leading-snug group-hover:text-indigo-600 transition-colors">
            {{ job.jobTitle }}
          </h3>
        </div>

        <!-- Footer / Tags -->
        <div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-50">
            <span class="text-xs font-mono text-slate-400">#{{ job.jobSlug?.substring(0, 8) || 'no-slug' }}</span>

          <a [routerLink]="['/jobs', job.jobSlug]" 
             class="text-sm font-semibold text-slate-700 hover:text-indigo-600 flex items-center gap-1">
            Details
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <ng-template #noFavs>
      <div class="flex flex-col items-center justify-center py-20 bg-white border-2 border-dashed border-slate-200 rounded-2xl text-center px-4">
        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
          </svg>
        </div>
        <h2 class="text-xl font-bold text-slate-800">Your list is empty</h2>
        <p class="text-slate-500 max-w-xs mx-auto mt-2">Looks like you haven't saved any jobs yet. Start exploring to fill this up!</p>
        
        <!-- Changed to routerLink="/" to fix your route match error -->
        <button routerLink="/" class="mt-6 px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-lg shadow-sm transition-all active:scale-95">
          Find Jobs
        </button>
      </div>
    </ng-template>

  </div>
</div>
