<!-- Page background set to #08a88a -->
<div class="min-h-screen bg-[#08a88a] flex items-center justify-center p-6">
 
  <div class="w-full max-w-md bg-white rounded-[2.5rem] p-10 shadow-2xl shadow-black/10">
    
    <!-- Header -->
   <div class="mb-10 text-center max-w-md mx-auto p-6 bg-white rounded-xl shadow-md">
  <h1 class="text-3xl font-semibold text-gray-900 tracking-tight mb-4">Account Settings</h1>
  
  <p class="text-gray-500 text-sm mb-6">Manage your profile details</p>
  
  <button 
    (click)="deleteMyAccount()"
    class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white font-medium rounded-md transition-colors duration-200"
  >
    Delete My Account
  </button>
</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Name Section -->
      <div class="grid grid-cols-2 gap-6">
        <div class="space-y-1">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">First Name</label>
          <input 
            formControlName="firstName" 
            type="text"
            placeholder="First name"
            class="w-full border-b border-gray-200 py-2 focus:border-[#08a88a] outline-none transition-all placeholder:text-gray-200"
          />
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Last Name</label>
          <input 
            formControlName="lastName" 
            type="text"
            placeholder="Last name"
            class="w-full border-b border-gray-200 py-2 focus:border-[#08a88a] outline-none transition-all placeholder:text-gray-200"
          />
        </div>
      </div>

      <!-- Email Section -->
      <div class="space-y-1">
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Email Address</label>
        <input 
          formControlName="email" 
          type="email"
          placeholder="email@example.com"
          class="w-full border-b border-gray-200 py-2 focus:border-[#08a88a] outline-none transition-all placeholder:text-gray-200"
        />
      </div>

      <!-- Password Section -->
      <div class="space-y-1">
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">New Password</label>
        <input 
          formControlName="password" 
          type="password"
          placeholder="••••••••"
          class="w-full border-b border-gray-200 py-2 focus:border-[#08a88a] outline-none transition-all placeholder:text-gray-200"
        />
        <p class="text-[9px] text-gray-300 pt-1 italic">Leave blank to keep current password.</p>
      </div>

      <!-- Action Button (Changed to Dark for Contrast) -->
      <div class="pt-8">
        <button 
          type="submit"
          class="w-full bg-gray-900 text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-[0.2em] hover:bg-black transition-all active:scale-[0.97] shadow-lg shadow-gray-200"
        >
          Save Changes
        </button>
      </div>

    </form>
  </div>
</div>
